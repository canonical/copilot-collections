name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-sh:
    name: Lint shell scripts
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck shfmt

      - name: Lint shell scripts
        run: make lint-sh
