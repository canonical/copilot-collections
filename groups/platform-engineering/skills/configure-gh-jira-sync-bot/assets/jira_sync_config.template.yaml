# template-version: 1
# This file is synced from canonical/platform-engineering-charm-template.
# Remove this comment block to opt this file out of automatic template propagation.
# See https://github.com/canonical/gh-jira-sync-bot for config
settings:
  jira_project_key: "ISD"

  status_mapping:
    opened: Untriaged
    closed: done
    not_planned: rejected

  add_gh_comment: true

  # Avoid "Dependency dashboard" issues to be synced to Jira
  labels:
  - bug
  - enhancement

  label_mapping:
    bug: Bug
    enhancement: Story

  # Jira component names (case-sensitive)
  components:
  - <your-component>
