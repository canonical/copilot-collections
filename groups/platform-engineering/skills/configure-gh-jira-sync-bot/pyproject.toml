[project]
name = "validate-jira-sync-config"
version = "1.0.0"
description = "Validate a gh-jira-sync-bot .jira_sync_config.yaml file"
requires-python = ">=3.11"
dependencies = ["pyyaml", "typer"]

[project.scripts]
validate-jira-sync-config = "validate_config:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["validate_config"]
